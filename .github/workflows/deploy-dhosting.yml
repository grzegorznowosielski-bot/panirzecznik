name: Deploy to dhosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ostudios.ftp.dhosting.pl
          username: iriph4_panirzecznik
          password: ${{ secrets.DHOST_FTP_PASS }}
          server-dir: /public_html/
          port: 21
          protocol: ftps
          timeout: 300000
          dangerous-clean-slate: false
